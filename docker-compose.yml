version: '3.8'

services:
  office-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office_assistant_app
    restart: always
    ports:
      - "8080:80" # 映射主机 8080 端口到容器 80 端口（可按需更改为 80:80 或 3000:80）
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
