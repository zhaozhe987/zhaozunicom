services:
  office-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: office_assistant_app
    restart: always
    ports:
      - "10000:10000" # 映射主机 10000 端口到容器 10000 端口
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:10000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
